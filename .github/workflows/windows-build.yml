name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build Sector/Sector.csproj --configuration Release

      - name: Run file import and export self-tests
        run: dotnet run --project Sector.SelfTest/Sector.SelfTest.csproj --configuration Release

      - name: Publish portable Windows package
        run: dotnet publish Sector/Sector.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true --output artifacts/Sector

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Sector-win-x64
          path: artifacts/Sector/**
          if-no-files-found: error
          retention-days: 14
